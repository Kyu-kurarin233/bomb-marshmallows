<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Mobile Responsive -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Website Title -->
    <title>Study Notes</title>

    <!-- Connect CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         Website Header
         ===================================================== -->

    <header>

        <h1>📚 Study Notes</h1>

        <p>
            为了方便复习，MyLO 简直就是个狗屎网站啊。
        </p>

    </header>



    <!-- =====================================================
         Main Website Area
         ===================================================== -->

    <main>


        <!-- =================================================
             Left Sidebar
             Course Navigation
             ================================================= -->

        <aside class="sidebar">

            <h3>Courses</h3>


            <!--
                JavaScript will automatically
                create course buttons here.
            -->

            <div id="courseList"></div>


            <!-- Add Course -->

            <button
                id="addCourseButton"
                class="add-course-button"
                type="button"
            >
                ➕ Add Course
            </button>


            <!-- Export Backup -->

            <button
                id="exportButton"
                class="data-button"
                type="button"
            >
                💾 Export Backup
            </button>


            <!-- Import Backup -->

            <button
                id="importButton"
                class="data-button"
                type="button"
            >
                📂 Import Backup
            </button>


            <!--
                Hidden file input.

                The user does not see this directly.
                JavaScript opens it when
                Import Backup is clicked.
            -->

            <input
                type="file"
                id="importFile"
                accept=".json,application/json"
                hidden
            >

        </aside>



        <!-- =================================================
             Middle Sidebar
             Week Navigation
             ================================================= -->

        <aside
            class="week-sidebar"
            id="weekSidebar"
        >

            <h3>Weeks</h3>

            <p>
                Select a course first.
            </p>

        </aside>



        <!-- =================================================
             Main Content
             ================================================= -->

        <section class="content">


            <!-- Page Title -->

            <h2 id="pageTitle">
                Ciallo ～(∠・ω< )⌒★ !
            </h2>


            <!-- Page Description -->

            <p id="pageDescription">
                Select a course and week to start studying.
            </p>


            <!--
                JavaScript will put notes,
                forms,
                Markdown editor,
                and Markdown preview here.
            -->

            <div id="noteContent">

                <p>
                    Notes will appear here.
                </p>

            </div>


        </section>


    </main>



    <!-- =====================================================
         JavaScript Libraries
         ===================================================== -->


    <!-- Markdown Library -->

    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
    ></script>


    <!-- Your JavaScript -->

    <script
        src="script.js"
    ></script>


</body>

</html>
