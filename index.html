<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Notes</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Website Header -->
    <header>
        <h1>📚Study Notes</h1>
        <p>为了方便复习,mylo简直就是个狗屎网站啊。</p>

    <!-- Main website area -->
    <main>

    <!-- 左边：课程导航 -->
        <aside class="sidebar">

            <h3>Courses</h3>

            <button class="course-button" data-course="KIT111">

            <button class="course-button" data-course="KIT107">

            <p>Select a course first.</p>

        </aside>


        <!-- 右边：真正的笔记内容 -->
        <section class="content">

            <h2 id="pageTitle">
                Ciallo ～(∠・ω< )⌒★ !
            </h2>

            <p id="pageDescription">
                Select a course and week to start studying.
            </p>

            <div id="noteContent">

                <p>
                    Your notes will appear here.
                </p>

            </div>

        </section>

    </main>
        




    <!-- Connect JavaScript -->
    <script src="script.js"></script>
